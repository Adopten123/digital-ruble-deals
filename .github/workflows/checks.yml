name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  code:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: poaktu_test
          POSTGRES_PASSWORD: poaktu_ci_only
          POSTGRES_DB: poaktu_foundation_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poaktu_test -d poaktu_foundation_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://poaktu_test:poaktu_ci_only@127.0.0.1:5432/poaktu_foundation_test?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - run: go build ./cmd/poaktu
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run typecheck:e2e
        working-directory: web
      - run: npm run docs:check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
  compose:
    runs-on: ubuntu-24.04
    needs: code
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Install Chromium for UI tests
        run: npx playwright install --with-deps chromium
        working-directory: web
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: node scripts/smoke.mjs
        env:
          SMOKE_STATE_FILE: ${{ runner.temp }}/poaktu-deal-drafts-smoke.json
      - name: Check idempotent bootstrap
        run: docker compose run --rm bootstrap
      - name: Check API restart persistence
        run: docker compose restart api web
      - run: node scripts/smoke.mjs
        env:
          SMOKE_STATE_FILE: ${{ runner.temp }}/poaktu-deal-drafts-smoke.json
      - name: Live API and browser scenarios
        run: npm run test:e2e
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Independent checkpoint and stopped/live CLI verification
        run: |
          sudo install -d -o 10001 -g 10001 -m 0700 "$POAKTU_REFERENCE_DIR"
          node scripts/integrity-smoke.mjs
        env:
          POAKTU_REFERENCE_DIR: ${{ runner.temp }}/poaktu-independent-reference
      - name: Test reports and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-api-test-report
          path: |
            web/playwright-report/
            web/test-results/artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Failure logs
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop test contour
        if: always()
        run: docker compose down --remove-orphans
