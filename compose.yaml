name: poaktu

x-backend: &backend
  image: poaktu-api:foundation
  build:
    context: .
    dockerfile: deploy/api.Dockerfile
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [database]

x-environment: &environment
  DATABASE_URL: postgres://poaktu_runtime:poaktu_runtime_demo_only@db:5432/poaktu?sslmode=disable
  HTTP_ADDR: :8080
  APP_ORIGIN: ${POAKTU_ORIGIN:-http://localhost:8080}
  DEMO_MODE: "true"
  APP_KEY_FILE: /var/lib/poaktu/keys/app.key
  MIGRATIONS_DIR: /app/migrations

services:
  db:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: poaktu
      POSTGRES_USER: poaktu_owner
      POSTGRES_PASSWORD: poaktu_owner_demo_only
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - db_data:/var/lib/postgresql
      - ./deploy/postgres/001_roles.sql:/docker-entrypoint-initdb.d/001_roles.sql:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U poaktu_owner -d poaktu"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [migrate]
    environment:
      <<: *environment
      DATABASE_URL: postgres://poaktu_owner:poaktu_owner_demo_only@db:5432/poaktu?sslmode=disable
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  access:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    entrypoint: [psql]
    command: [--host=db, --username=poaktu_owner, --dbname=poaktu, --no-psqlrc, --set=ON_ERROR_STOP=1, --file=/bootstrap/runtime_grants.sql]
    environment:
      PGPASSWORD: poaktu_owner_demo_only
    volumes:
      - ./deploy/postgres/runtime_grants.sql:/bootstrap/runtime_grants.sql:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    networks: [database]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  bootstrap:
    <<: *backend
    command: [bootstrap]
    environment:
      <<: *environment
      DATABASE_URL: postgres://poaktu_owner:poaktu_owner_demo_only@db:5432/poaktu?sslmode=disable
    volumes:
      - app_keys:/var/lib/poaktu/keys
    depends_on:
      access: {condition: service_completed_successfully}
    restart: "no"

  api:
    <<: *backend
    environment: *environment
    volumes:
      - app_keys:/var/lib/poaktu/keys:ro
      - documents:/var/lib/poaktu/documents
    networks: [database, frontend]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /app/poaktu, healthcheck]
      interval: 5s
      timeout: 6s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  web:
    image: poaktu-web:foundation
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports: ["127.0.0.1:${POAKTU_PORT:-8080}:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [ingress, frontend]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  ingress: {driver: bridge}
  database: {internal: true}
  frontend: {internal: true}
volumes:
  db_data:
  app_keys:
  documents:
